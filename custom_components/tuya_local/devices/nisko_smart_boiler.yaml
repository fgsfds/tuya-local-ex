name: Water heater switch
products:
  - id: pjjcybgnxzitkacu
    manufacturer: Nisko
    model: Smart Boiler
entities:
  - entity: switch
    name: Boiler
    dps:
      - id: 1
        type: boolean
        name: switch
  - entity: number
    name: Set Boiler Timer
    icon: mdi:timer-cog-outline
    mode: box
    category: config
    dps:
      - id: 7
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 120
  - entity: sensor
    name: Remaining time
    category: diagnostic
    dps:
      - id: 7
        type: integer
        name: sensor
        unit: min
  - entity: sensor
    category: diagnostic
    class: power
    dps:
      - id: 103
        type: integer
        name: sensor
        unit: W
  - entity: sensor
    category: diagnostic
    class: voltage
    dps:
      - id: 104
        type: integer
        name: sensor
        precision: 1
        mapping:
          - scale: 10
        unit: V
  - entity: sensor
    category: diagnostic
    class: current
    dps:
      - id: 102
        type: integer
        name: sensor
        precision: 2
        mapping:
          - scale: 1000
        unit: A
