name: Sous vide
products:
  - id: qs8ko30js1csqlo8
    manufacturer: JUSTBUY
    model: SV9008W
entities:
  - entity: water_heater
    dps:
      - id: 2
        type: boolean
        name: operation_mode
        mapping:
          - dps_val: false
            value: "off"
          - dps_val: true
            value: electric
      - id: 9
        type: integer
        name: temperature
        unit: C
        range:
          min: 250
          max: 925
        mapping:
          - scale: 10
      - id: 10
        type: integer
        name: current_temperature
        unit: C
        mapping:
          - scale: 10
  - entity: sensor
    translation_key: cooking_status
    dps:
      - id: 5
        type: string
        name: sensor
  - entity: number
    name: Cooking time
    class: duration
    dps:
      - id: 7
        type: integer
        name: value
        unit: min
        range:
          min: 1
          max: 5999
  - entity: sensor
    translation_key: time_remaining
    class: duration
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: min
  - entity: sensor
    name: Display temperature unit
    category: diagnostic
    dps:
      - id: 11
        type: string
        name: sensor
  - entity: sensor
    name: DP 13
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        optional: true
      - id: 13
        type: integer
        name: raw_code
        optional: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        optional: true
        mapping:
          - dps_val: null
            value: null
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: integer
        name: fault_code
        optional: true
