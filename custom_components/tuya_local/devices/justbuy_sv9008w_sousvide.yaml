name: Sous vide
products:
  - id: qs8ko30js1csqlo8
    manufacturer: JUSTBUY
    model: SV9008W
entities:
  - entity: switch
    name: Start
    dps:
      - id: 2
        type: boolean
        name: switch
  - entity: sensor
    translation_key: cooking_status
    dps:
      - id: 5
        type: string
        name: sensor
  - entity: number
    name: Cooking time
    category: config
    class: duration
    dps:
      - id: 7
        type: integer
        name: value
        unit: min
        range:
          min: 1
          max: 5999
  - entity: sensor
    translation_key: time_remaining
    class: duration
    dps:
      - id: 8
        type: integer
        name: sensor
        unit: min
  - entity: number
    name: Cooking temperature
    category: config
    class: temperature
    dps:
      - id: 9
        type: integer
        name: value
        unit: C
        range:
          min: 250
          max: 925
        mapping:
          - scale: 10
  - entity: sensor
    name: Current temperature
    class: temperature
    dps:
      - id: 10
        type: integer
        name: sensor
        unit: C
        class: measurement
        mapping:
          - scale: 10
  - entity: sensor
    name: Display temperature unit
    category: diagnostic
    dps:
      - id: 11
        type: string
        name: sensor
  - entity: sensor
    name: DP 13
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        optional: true
      - id: 13
        type: integer
        name: raw_code
        optional: true
  - entity: binary_sensor
    class: problem
    category: diagnostic
    dps:
      - id: 13
        type: integer
        name: sensor
        optional: true
        mapping:
          - dps_val: null
            value: null
          - dps_val: 0
            value: false
          - value: true
      - id: 13
        type: integer
        name: fault_code
        optional: true
